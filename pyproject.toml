[project]
name = "maier"
dynamic = ["version"]
description = "Local-first, folder-centric photo culling app: the filesystem is the state."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["photo", "culling", "photography", "raw", "lightroom", "desktop"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "django~=6.0",
    "waitress",
    "pillow",
    "pillow-heif",
    "imagehash",
    "platformdirs",
    "whitenoise",
    "pywebview",
    "pyicloud>=2.6",
]

[project.urls]
Repository = "https://github.com/Tyn-Studio/maier"

[project.scripts]
maier = "maier.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]
# PyInstaller is only needed to build Tier-3 double-click bundles (SPEC §13);
# it is not a runtime dependency of the library/CLI, so it lives in its own
# group rather than `dev`.
build = [
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maier"]

[tool.hatch.version]
path = "src/maier/__init__.py"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/migrations/*.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "maier.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p _bootstrap"
markers = [
    "slow: exercises a real subprocess / server round trip (>5s)",
]
