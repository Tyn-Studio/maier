name: Release

# Triggered by pushing a tag like `v0.1.0`. Nothing in this workflow runs on
# normal pushes/PRs (that's ci.yml) -- it is inert until a human tags a
# release. The PyPI publish step is currently disabled (`if: false`) pending
# an actual PyPI project + trusted-publishing setup; this workflow will need
# a real run against a tag to shake out the PyInstaller/signing specifics
# before it's trusted for an actual release.

on:
  push:
    tags:
      - "v*"

env:
  MAIER_FORCE_NO_WINDOW: "1"

jobs:
  test:
    # Ubuntu only here -- the full OS matrix is already covered by ci.yml on
    # every push to main; re-running it per-tag would be redundant. This is
    # a final gate before anything gets built/published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest

  build-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maier-pypi-dist
          path: dist/

      - name: Publish to PyPI
        # TODO(release): enable after the PyPI project "maier" exists.
        # Needs either a PYPI_API_TOKEN repo secret or trusted publishing
        # configured on the PyPI project settings (preferred -- no secret to
        # manage; see https://docs.pypi.org/trusted-publishers/).
        # skip-existing avoids failing the whole workflow if this version
        # was already published.
        if: false # TODO(release): enable after PyPI project exists
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          # password: ${{ secrets.PYPI_API_TOKEN }}   # only if not using trusted publishing

  build-bundles:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # v0.1.0 ships macOS-only: the windows/linux PyInstaller legs have
        # never been exercised and one failed leg blocks the whole release
        # (needs: build-bundles). Re-enable per-OS after a green macOS
        # release: [macos-14, windows-latest, ubuntu-latest]
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (incl. PyInstaller)
        run: uv sync --group build

      # TODO(signing): unsigned builds for v1 (SPEC §13). Fast-follow once
      # there are external users:
      #   macOS:   codesign + notarytool, needs APPLE_CERTIFICATE /
      #            APPLE_CERTIFICATE_PASSWORD / APPLE_TEAM_ID / an
      #            app-specific password secret, wired into maier.spec's
      #            codesign_identity/entitlements_file.
      #   Windows: Authenticode signing, needs a WINDOWS_CERTIFICATE +
      #            WINDOWS_CERTIFICATE_PASSWORD secret (or Azure Trusted
      #            Signing) and a signtool step after PyInstaller runs.
      - name: Build bundle (PyInstaller)
        run: uv run pyinstaller packaging/maier.spec

      - name: Smoke test the built bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 scripts/smoke_test.py "dist/Maier.app/Contents/MacOS/Maier" "$RUNNER_TEMP/smoke-folder" --timeout 40

      - name: Smoke test the built bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 scripts/smoke_test.py "dist/Maier/Maier" "$RUNNER_TEMP/smoke-folder" --timeout 40

      - name: Smoke test the built bundle (Windows)
        if: runner.os == 'Windows'
        # Uncertain: PyInstaller's Windows one-dir layout + pywebview's
        # WebView2 backend are best-effort here, not yet verified against a
        # real build -- expect to iterate on this step against a real tag.
        run: |
          python scripts/smoke_test.py "dist\Maier\Maier.exe" "$env:RUNNER_TEMP\smoke-folder" --timeout 40

      - name: Package bundle for release
        # Windows: a zipped exe for now -- SPEC §13 mentions an Inno Setup
        # installer as an alternative, not yet built. Linux: tarball
        # placeholder -- AppImage packaging (SPEC §13) not yet implemented.
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --sequesterRsrc --keepParent dist/Maier.app out/Maier-macos.zip
              ;;
            Linux)
              tar -C dist -czf out/Maier-linux.tar.gz Maier
              ;;
            Windows)
              powershell -Command "Compress-Archive -Path dist/Maier -DestinationPath out/Maier-windows.zip"
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maier-bundle-${{ runner.os }}
          path: out/

  publish-release:
    needs: build-bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maier-bundle-*
          path: artifacts
          merge-multiple: true

      - name: Attach bundles to GitHub Release
        # PLAN T27 / CTO update-notification flag: this job is gated on
        # `on: push: tags: v*` at the top of this file (see the trigger
        # block) -- nothing here runs on ordinary pushes/PRs, only on an
        # actual tag push.
        #
        # !!! BEHAVIOR CHANGE, FLAGGED PER T27 BRIEF !!!
        # `draft` flipped true -> false (with `prerelease: false` set
        # explicitly) so that pushing a `v*` tag now publishes a VISIBLE
        # GitHub Release immediately, no human "publish" click required.
        # This is a deliberate, not accidental, change: GitHub's
        # `releases/latest` API (which `core/updates.py`'s in-app update
        # check polls) only ever returns non-draft, non-prerelease releases
        # -- a draft release is invisible to it, so the update notification
        # feature does not work at all until this flips. Net effect: from
        # now on, tagging `vX.Y.Z` on this repo publishes a public release
        # the moment CI finishes, with no review gate in between. If a
        # human-reviewed-before-publish step is wanted back, reintroduce it
        # as a separate manual "promote" step (e.g. workflow_dispatch that
        # un-drafts a specific release) rather than reverting this flag,
        # since reverting silently breaks the update check again.
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
